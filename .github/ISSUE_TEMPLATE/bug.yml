name: Ошибка
description: Программа работает неправильно, падает или показывает неверные данные.
title: '[Ошибка]: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |-
        Не публикуйте пароли, SSH-ключи, VK-хеши и ссылки `wdtt://` — обращение видно всем.
  - type: input
    id: version
    attributes:
      label: Версия WDTT Plus
      description: «Настройки» → «О программе».
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Версия Windows
      placeholder: 'Например: Windows 11 24H2'
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Что вы делали
      description: Шаги, после которых появилась ошибка.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Что произошло и что ожидалось
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Журнал
      description: «Журнал» → «Копировать». Удалите из него адреса и личные данные.
      render: text
