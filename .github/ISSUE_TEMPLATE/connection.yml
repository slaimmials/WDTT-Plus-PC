name: Проблема подключения
description: Не подключается, нет интернета, обрывы, капча, проблемы с сервером.
title: '[Подключение]: '
labels:
  - connection
body:
  - type: markdown
    attributes:
      value: |-
        Не публикуйте пароли, SSH-ключи, VK-хеши и ссылки `wdtt://` — обращение видно всем.
  - type: input
    id: version
    attributes:
      label: Версия WDTT Plus
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Режим
      options:
        - VPN
        - Прокси (SOCKS5 + HTTP)
        - SOCKS5
        - HTTP
    validations:
      required: true
  - type: dropdown
    id: server
    attributes:
      label: Сервер
      options:
        - Установлен из WDTT Plus для Windows
        - Установлен из Android-версии
        - Установлен вручную через install.sh
        - Чужой сервер, профиль по ссылке
    validations:
      required: true
  - type: input
    id: network
    attributes:
      label: Сеть
      placeholder: 'Например: домашний Wi-Fi, провайдер N; мобильный интернет через телефон'
  - type: textarea
    id: problem
    attributes:
      label: Что происходит
      description: На каком этапе останавливается подключение, как часто, что уже пробовали.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Журнал
      description: «Журнал» → «Копировать». Удалите из него адреса и личные данные.
      render: text
    validations:
      required: true
